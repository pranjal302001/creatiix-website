<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Property · Urban Nest Properties (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-bar"><b>Demo website</b> built by CREATIIX. Urban Nest Properties is fictional; listings and prices are not real.</div>
<header><div class="wrap">
  <a class="brand" href="index.html"><i>U</i>Urban Nest</a>
  <nav><a href="index.html#listings">Properties</a><a href="index.html#how">How it works</a><a href="index.html#areas">Areas</a><a href="index.html#contact">Contact</a></nav>
  <a class="btn" href="#visit">Book a visit</a>
</div></header>

<main class="wrap" id="page"></main>

<footer><div class="wrap"><span>© Urban Nest Properties (fictional demo brand)</span><span>Website designed and built by CREATIIX</span></div></footer>

<script src="listings.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const l = LISTINGS.find((x) => x.id === id);
const page = document.getElementById('page');
if (!l) {
  page.innerHTML = '<div style="padding:90px 0;text-align:center"><h1>Property not found</h1><p style="margin:14px 0 24px;color:var(--muted)">It may have been sold or let.</p><a class="btn" href="index.html#listings">See all properties</a></div>';
} else {
  document.title = `${l.title}, ${l.area} · Urban Nest Properties (Demo)`;
  page.innerHTML = `
    <p class="crumb"><a href="index.html#listings">Properties</a> / ${l.area} / ${l.title}</p>
    <div class="detail">
      <div>
        <div class="photo"><img src="${l.img}" alt=""></div>
        <p class="eyebrow" style="margin-top:26px">For ${l.deal === 'Buy' ? 'sale' : 'rent'} · ${l.area}</p>
        <h1 style="font-size:clamp(30px,4vw,46px);margin:8px 0 6px">${l.title}</h1>
        <p class="price" style="font-size:30px">${formatPrice(l)}</p>
        <div class="facts">
          <div><small>Size</small>${sizeLabel(l)}</div>
          <div><small>Carpet area</small>${l.sqft} sq ft</div>
          <div><small>Floor</small>${l.floor}</div>
          <div><small>Furnishing</small>${l.furnishing}</div>
        </div>
        <h2 style="font-size:24px;margin-bottom:8px">About this property</h2>
        <p style="color:var(--muted);max-width:640px">${l.desc}</p>
        <div class="tags" style="margin-top:16px">${l.tags.map((t) => `<span>${t}</span>`).join('')}</div>
      </div>
      <form class="side" id="visit">
        <h2 style="font-size:24px">Book a visit</h2>
        <p style="color:var(--muted);font-size:15px;margin-top:-6px">Pick a day and we will confirm the time.</p>
        <div><label for="v-name">Your name</label><input id="v-name" required autocomplete="name"></div>
        <div><label for="v-phone">Phone number</label><input id="v-phone" type="tel" required autocomplete="tel"></div>
        <div><label for="v-date">Preferred day</label><input id="v-date" type="date" required></div>
        <button class="btn">Request visit</button>
        <p class="ok" id="ok" hidden>Visit requested! In a real site the advisor would get this on WhatsApp. This is a demo, so nothing was sent.</p>
      </form>
    </div>`;
  const date = document.getElementById('v-date');
  date.min = new Date().toISOString().slice(0, 10);
  document.getElementById('visit').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('ok').hidden = false; e.target.reset(); });
}
</script>
</body>
</html>
